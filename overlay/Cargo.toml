[package]
name = "mxbo-overlay"
version = "0.1.3"
edition = "2021"

[[bin]]
name = "Holeshot-HUD"
path = "src/main.rs"

[[bin]]
name = "dump-track"
path = "src/bin/dump-track.rs"

[workspace]
members = ["hud"]

[build-dependencies]
winresource = "0.1"

[dependencies]
mxbo-hud = { path = "hud" }
tiny-skia = { version = "0.11", features = ["png-format"] }
fontdue = "0.9"
ureq = "2.12"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    "Win32_Security",
] }
