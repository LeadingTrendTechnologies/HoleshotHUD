[package]
name = "mxbo-overlay"
version = "0.5.0"
edition = "2021"

[[bin]]
name = "Holeshot-HUD"
path = "src/main.rs"

[[bin]]
name = "dump-track"
path = "src/bin/dump-track.rs"

[workspace]
members = ["hud"]

[build-dependencies]
winresource = "0.1"

[dependencies]
mxbo-hud = { path = "hud" }
tiny-skia = { version = "0.11", features = ["png-format"] }
fontdue = "0.9"
ureq = "2.12"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_XboxController",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_DataExchange",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_ProcessStatus",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Security",
] }

# `cargo run` stays debug (Sectors unlocked) but tiny-skia in opt-level 0 is too slow for the HUD.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
