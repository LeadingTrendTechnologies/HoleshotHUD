Key=32,0,0,0
PresetShortcut=0
Dispatching=0

; MX Bikes — Clean Vibrant (all GPUs)
; Lightweight stock effects only. Neutral RGB — dirt stays brown/grey, not orange.
; Install ReShade on mxbikes.exe as Direct3D 9 and select this preset.

PreprocessorDefinitions=
Techniques=Deband@Deband.fx,Curves@Curves.fx,LiftGammaGain@LiftGammaGain.fx,Vibrance@Vibrance.fx,ContrastAdaptiveSharpen@CAS.fx
TechniqueSorting=Deband@Deband.fx,Curves@Curves.fx,LiftGammaGain@LiftGammaGain.fx,Vibrance@Vibrance.fx,ContrastAdaptiveSharpen@CAS.fx

[Deband.fx]
enable_weber=1
enable_sdeviation=1
enable_depthbuffer=0
t1=0.007000
t2=0.040000
banding_depth=1.000000
range=24.000000
iterations=1
debug_output=0

[Curves.fx]
Mode=0
Formula=4
Contrast=0.380000

[LiftGammaGain.fx]
; Keep all three channels equal — extra red/green oranges tracks.
RGB_Lift=1.025000,1.025000,1.025000
RGB_Gamma=0.985000,0.985000,0.985000
RGB_Gain=1.020000,1.020000,1.020000

[Vibrance.fx]
Vibrance=0.220000
VibranceRGBBalance=1.000000,1.000000,1.000000

[CAS.fx]
Contrast=0.000000
Sharpening=0.420000
