Key=32,0,0,0
PresetShortcut=0
Dispatching=0

; MX Bikes — Clean Vibrant Plus (still older-GPU friendly)
; Same look as Clean Vibrant, plus SMAA for softer edges.
; Still no AO / bloom / LUTs / warm grading.

PreprocessorDefinitions=
Techniques=Deband@Deband.fx,SMAA@SMAA.fx,Curves@Curves.fx,LiftGammaGain@LiftGammaGain.fx,Vibrance@Vibrance.fx,ContrastAdaptiveSharpen@CAS.fx
TechniqueSorting=Deband@Deband.fx,SMAA@SMAA.fx,Curves@Curves.fx,LiftGammaGain@LiftGammaGain.fx,Vibrance@Vibrance.fx,ContrastAdaptiveSharpen@CAS.fx

[Deband.fx]
enable_weber=1
enable_sdeviation=1
enable_depthbuffer=0
t1=0.007000
t2=0.040000
banding_depth=1.000000
range=24.000000
iterations=1
debug_output=0

[SMAA.fx]
EdgeDetectionType=1
EdgeDetectionThreshold=0.100000
MaxSearchSteps=98
MaxSearchStepsDiagonal=16
CornerRounding=25
DebugOutput=0

[Curves.fx]
Mode=0
Formula=4
Contrast=0.380000

[LiftGammaGain.fx]
RGB_Lift=1.025000,1.025000,1.025000
RGB_Gamma=0.985000,0.985000,0.985000
RGB_Gain=1.020000,1.020000,1.020000

[Vibrance.fx]
Vibrance=0.220000
VibranceRGBBalance=1.000000,1.000000,1.000000

[CAS.fx]
Contrast=0.000000
Sharpening=0.380000
