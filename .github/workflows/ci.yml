name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    if: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' || !startsWith(github.event.head_commit.message, 'Ship ') }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: overlay

      - name: Test HUD library
        run: cargo test --manifest-path overlay/Cargo.toml --workspace

      - name: Build overlay stub
        run: cargo build --manifest-path overlay/Cargo.toml

  windows:
    # Version tags run Release only. Skip this duplicate Windows build on Ship commits.
    if: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' || !startsWith(github.event.head_commit.message, 'Ship ') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: overlay

      - name: Test overlay
        run: cargo test --manifest-path overlay/Cargo.toml --workspace

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: golden-mismatches
          path: |
            overlay/hud/tests/goldens/*.actual.png
            overlay/tests/goldens/*.actual.png
          if-no-files-found: ignore

      - name: Build plugin
        run: msbuild mxbo.vcxproj /p:Configuration=Release /p:Platform=x64 /m

      - name: Build overlay
        run: cargo build --release --manifest-path overlay/Cargo.toml

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Pack installer
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/pack.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: MXBO-Overlay-windows-x64
          path: |
            dist/HoleshotHUD-Setup.exe
            dist/*.zip
