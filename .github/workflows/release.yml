name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: overlay

      - name: Build plugin
        run: msbuild mxbo.vcxproj /p:Configuration=Release /p:Platform=x64 /m

      - name: Check plugin/overlay SHM layout
        run: |
          msbuild tools/shm-abi.vcxproj /p:Configuration=Release /p:Platform=x64 /m
          $got = & .\out\Release\shm-abi.exe | Out-String
          $got = $got -replace "`r`n", "`n"
          $expected = (Get-Content -Raw src\shm\abi.txt) -replace "`r`n", "`n"
          if ($got.TrimEnd() -ne $expected.TrimEnd()) {
            throw "Plugin C snapshot layout does not match src/shm/abi.txt"
          }

      - name: Test plugin SHM publish
        run: |
          msbuild tools/shm-publish-test.vcxproj /p:Configuration=Release /p:Platform=x64 /m
          & .\out\Release\shm-publish-test.exe
          if ($LASTEXITCODE -ne 0) { throw "shm-publish-test failed" }

      - name: Build overlay
        run: cargo build --release --manifest-path overlay/Cargo.toml

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: List third-party crates
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/third-party.ps1

      - name: Pack installer
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/pack.ps1

      - name: Sign release zip
        env:
          HOLESHOT_UPDATE_SECRET_KEY: ${{ secrets.HOLESHOT_UPDATE_SECRET_KEY }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:HOLESHOT_UPDATE_SECRET_KEY)) {
            throw "HOLESHOT_UPDATE_SECRET_KEY is not set"
          }
          $key = Join-Path $env:RUNNER_TEMP "holeshot-update.key"
          $utf8 = New-Object System.Text.UTF8Encoding $false
          [System.IO.File]::WriteAllText($key, $env:HOLESHOT_UPDATE_SECRET_KEY, $utf8)
          $zip = Get-ChildItem dist\*.zip | Select-Object -First 1 -ExpandProperty FullName
          & .\overlay\target\release\sign-update.exe sign $key $zip
          if ($LASTEXITCODE -ne 0) { throw "Could not sign the release zip" }
          Remove-Item $key -Force

      - uses: actions/upload-artifact@v4
        with:
          name: MXBO-Overlay-windows-x64
          path: |
            dist/HoleshotHUD-Setup.exe
            dist/*.zip
            dist/*.minisig

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/HoleshotHUD-Setup.exe
            dist/*.zip
            dist/*.minisig
          body_path: CHANGELOG.md
          generate_release_notes: true
