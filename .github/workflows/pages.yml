name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: web-preview

      - name: Install wasm-bindgen
        run: cargo install wasm-bindgen-cli --locked --version 0.2.127

      - name: Build preview
        run: |
          cargo build --release --target wasm32-unknown-unknown --manifest-path web-preview/Cargo.toml
          mkdir -p web/pkg
          wasm-bindgen --target web --out-dir web/pkg web-preview/target/wasm32-unknown-unknown/release/mxbo_web_preview.wasm

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
