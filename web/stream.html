<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Holeshot HUD — Stream</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; background: transparent; }
</style>
</head>
<body>
<!--
  OBS Browser Source page. Phase 1: the overlay serves this HTML and pushes
  live PNG frames over WebSocket (same draw path as the game HUD).
  WASM Live API (web-preview) is available for a future Snapshot+INI client.
-->
<canvas id="c" width="1920" height="1080"></canvas>
<script>
(() => {
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  const fit = () => {
    const w = window.innerWidth || 1920;
    const h = window.innerHeight || 1080;
    canvas.width = w;
    canvas.height = h;
  };
  fit();
  window.addEventListener("resize", fit);
  let ws;
  const connect = () => {
    const proto = location.protocol === "https:" ? "wss" : "ws";
    ws = new WebSocket(`${proto}://${location.host}/ws`);
    ws.binaryType = "arraybuffer";
    ws.onmessage = async (ev) => {
      const blob = new Blob([ev.data], { type: "image/png" });
      const bmp = await createImageBitmap(blob);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(bmp, 0, 0, canvas.width, canvas.height);
      bmp.close();
    };
    ws.onclose = () => setTimeout(connect, 1000);
    ws.onerror = () => { try { ws.close(); } catch (_) {} };
  };
  connect();
})();
</script>
</body>
</html>
