<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Holeshot HUD — live widget editor</title>
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" href="logo.png" type="image/png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="brand">
      <img class="logo" src="logo.png" width="48" height="48" alt="Holeshot HUD" />
      <div class="wordmark">
        <span class="name">Holeshot</span>
        <span class="hud">HUD</span>
      </div>
    </div>
    <p>One widget at a time. Edit fields like in the app. Turn on Move and resize to show the border and drag handles.</p>
    <a class="download" href="https://github.com/LeadingTrendTechnologies/HoleshotHUD/releases/latest/download/HoleshotHUD-Setup.exe">Download for Windows</a>
  </header>
  <main>
    <aside>
      <h2>Widget</h2>
      <button type="button" data-widget="standings" class="on">Standings</button>
      <button type="button" data-widget="relative">Relative</button>
      <button type="button" data-widget="dash">Dash</button>
      <button type="button" data-widget="ticker">Horizontal Standings</button>
      <button type="button" data-widget="map">Map</button>
      <button type="button" data-widget="minimap">Minimap</button>
      <button type="button" data-widget="radar">Radar</button>
      <button type="button" data-widget="sys">Systems</button>
      <div class="row layout-toggle">
        <label for="layout-edit">Move and resize</label>
        <input id="layout-edit" class="toggle" type="checkbox" data-bool="layout_edit" />
      </div>
      <h2>Settings</h2>
      <div id="settings"></div>
    </aside>
    <section class="stage">
      <canvas id="hud" width="1280" height="720"></canvas>
      <p class="hint">Demo data — not connected to MX Bikes</p>
    </section>
  </main>
  <script type="module" src="demo.js?v=exo2"></script>
</body>
</html>
