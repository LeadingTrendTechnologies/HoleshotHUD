<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Holeshot HUD — feedback inbox</title>
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" href="logo.png" type="image/png" />
  <style>
    :root {
      --bg: #0c0c0e;
      --panel: #141416;
      --text: #e4e4e6;
      --dim: #84848a;
      --accent: #ff9430;
      --line: #2a2a2e;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
    header { padding: 28px 32px 12px; max-width: 880px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .logo { width: 48px; height: 48px; border-radius: 12px; }
    .wordmark { display: flex; flex-direction: column; line-height: 1; }
    .wordmark .name { font-size: 26px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; }
    .wordmark .hud { font-size: 12px; font-weight: 700; letter-spacing: 0.28em; color: var(--accent); margin-top: 4px; }
    header p { color: var(--dim); }
    main { padding: 12px 32px 48px; max-width: 880px; }
    form, .card, pre { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
    form { display: flex; gap: 8px; padding: 12px; margin-bottom: 16px; }
    input, button, select { font: inherit; }
    input { flex: 1; background: #0c0c0e; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
    button { background: var(--accent); color: #1a1008; font-weight: 700; border: 0; border-radius: 8px; padding: 10px 16px; cursor: pointer; }
    button.ghost { background: #2a2a2e; color: var(--text); }
    .err { color: #ff7878; margin: 0 0 16px; }
    .filters { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
    .chip { background: #1c1c20; color: var(--dim); border: 0; border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: 13px; }
    .chip.on { background: #3a2414; color: var(--accent); }
    .avg { margin-left: auto; color: var(--text); font-size: 14px; font-weight: 700; }
    .avg span { color: var(--accent); }
    .avg em { color: var(--dim); font-style: normal; font-weight: 500; font-size: 12px; }
    .card { padding: 14px 16px; margin-bottom: 10px; }
    .row { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
    .kind { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
    .when { color: var(--dim); font-size: 12px; }
    .summary { margin: 8px 0 10px; }
    .actions { display: flex; gap: 8px; }
    pre { padding: 12px; overflow: auto; white-space: pre-wrap; color: #c8c8ce; font-size: 12px; }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <img class="logo" src="logo.png" width="48" height="48" alt="Holeshot HUD" />
      <div class="wordmark">
        <span class="name">Holeshot</span>
        <span class="hud">INBOX</span>
      </div>
    </div>
    <p>Private feedback, bugs, and feature asks. Not GitHub issues.</p>
  </header>
  <main>
    <form id="gate">
      <input id="secret" type="password" autocomplete="current-password" placeholder="Inbox password" />
      <button type="submit">Open</button>
    </form>
    <p id="err" class="err" hidden></p>
    <div id="app" hidden>
      <div class="filters">
        <button class="chip on" data-kind="all" type="button">All</button>
        <button class="chip" data-kind="rating" type="button">Ratings</button>
        <button class="chip" data-kind="bug" type="button">Bugs</button>
        <button class="chip" data-kind="feature" type="button">Features</button>
        <p class="avg" id="avg"></p>
      </div>
      <div id="list"></div>
    </div>
  </main>
  <script>
    const gate = document.getElementById("gate");
    const secretInput = document.getElementById("secret");
    const err = document.getElementById("err");
    const app = document.getElementById("app");
    const list = document.getElementById("list");
    const avgEl = document.getElementById("avg");
    let secret = sessionStorage.getItem("hh-inbox") || "";
    let items = [];
    let filter = "all";

    function showErr(msg) {
      err.hidden = !msg;
      err.textContent = msg || "";
    }

    function headers() {
      return { "X-Inbox-Secret": secret };
    }

    async function loadList() {
      const res = await fetch("/api/inbox", { headers: headers() });
      if (res.status === 401) throw new Error("Wrong password.");
      if (!res.ok) throw new Error("Could not load the inbox.");
      const data = await res.json();
      items = data.items || [];
      render();
    }

    function starScore(it) {
      if (it.kind !== "rating") return 0;
      const m = String(it.summary || "").match(/^([1-5])\s*\/\s*5/);
      return m ? Number(m[1]) : 0;
    }

    function renderAvg() {
      const scores = items.map(starScore).filter((n) => n >= 1);
      if (!scores.length) {
        avgEl.innerHTML = "<em>No ratings yet</em>";
        return;
      }
      const avg = scores.reduce((a, b) => a + b, 0) / scores.length;
      const label = scores.length === 1 ? "rating" : "ratings";
      avgEl.innerHTML = `Average <span>${avg.toFixed(1)} / 5</span> <em>(${scores.length} ${label})</em>`;
    }

    function render() {
      renderAvg();
      const shown = items.filter((it) => filter === "all" || it.kind === filter);
      list.innerHTML = shown.length ? "" : "<p class='when'>Nothing here yet.</p>";
      for (const it of shown) {
        const card = document.createElement("article");
        card.className = "card";
        card.innerHTML = `
          <div class="row">
            <span class="kind">${it.kind}</span>
            <span class="when">${it.at ? new Date(it.at).toLocaleString() : ""}</span>
          </div>
          <p class="summary">${it.summary || ""}</p>
          <div class="actions">
            <button type="button" data-open="${it.id}">Details</button>
            <button class="ghost" type="button" data-del="${it.id}">Done</button>
          </div>
          <div class="detail" hidden></div>`;
        list.appendChild(card);
      }
    }

    gate.addEventListener("submit", async (e) => {
      e.preventDefault();
      secret = secretInput.value.trim();
      showErr("");
      try {
        await loadList();
        sessionStorage.setItem("hh-inbox", secret);
        gate.hidden = true;
        app.hidden = false;
      } catch (e) {
        showErr(e.message);
      }
    });

    document.querySelectorAll(".chip").forEach((btn) => {
      btn.addEventListener("click", () => {
        filter = btn.dataset.kind;
        document.querySelectorAll(".chip").forEach((b) => b.classList.toggle("on", b === btn));
        render();
      });
    });

    list.addEventListener("click", async (e) => {
      const open = e.target.dataset.open;
      const del = e.target.dataset.del;
      if (open) {
        const card = e.target.closest(".card");
        const detail = card.querySelector(".detail");
        if (!detail.hidden) {
          detail.hidden = true;
          return;
        }
        const res = await fetch(`/api/inbox?id=${encodeURIComponent(open)}`, { headers: headers() });
        if (!res.ok) {
          showErr("Could not load that item.");
          return;
        }
        const gist = await res.json();
        const note = gist.files["feedback.json"] || "";
        const logName = Object.keys(gist.files).find((n) => n !== "feedback.json");
        detail.hidden = false;
        detail.innerHTML = `<pre>${note.replace(/[<>&]/g, (c) => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;" }[c]))}</pre>
          ${logName ? `<p class="when">${logName} attached</p><pre>${String(gist.files[logName]).replace(/[<>&]/g, (c) => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;" }[c]))}</pre>` : ""}`;
      }
      if (del) {
        const res = await fetch(`/api/inbox?id=${encodeURIComponent(del)}`, { method: "DELETE", headers: headers() });
        if (res.status === 204) {
          items = items.filter((it) => it.id !== del);
          render();
        }
      }
    });

    if (secret) {
      loadList()
        .then(() => {
          gate.hidden = true;
          app.hidden = false;
        })
        .catch(() => {
          sessionStorage.removeItem("hh-inbox");
          secret = "";
        });
    }
  </script>
</body>
</html>
